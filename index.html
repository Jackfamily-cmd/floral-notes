<style>
:root{--bg:#EAF0EC;--card:#fff;--ink:#17231F;--mute:#5E706A;--line:#CBD9D2;--acc:#B83B6B;--acct:#fff;--moss:#2F5D50;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101916;--card:#1A2822;--ink:#E6EFEA;--mute:#93A8A0;--line:#2D4038;--acc:#E0709A;--acct:#1A0A12;--moss:#8FC4AF}}
:root[data-theme="dark"]{--bg:#101916;--card:#1A2822;--ink:#E6EFEA;--mute:#93A8A0;--line:#2D4038;--acc:#E0709A;--acct:#1A0A12;--moss:#8FC4AF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;padding-bottom:96px}
header{padding:14px 16px 4px;display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:24px;color:var(--moss);letter-spacing:.04em}
.ghost{background:none;border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:4px 12px;font:inherit;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px}
.chip.on{background:var(--moss);border-color:var(--moss);color:var(--bg)}
#list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 16px}
.card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ph{background:var(--line);display:grid;place-items:center;font-size:34px}
.card .b{padding:8px 10px 10px}.card h3{margin:0;font-size:15px}.card p{margin:2px 0 0;font-size:12.5px;color:var(--mute)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:48px 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:14px 0}
nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
#fab{position:fixed;right:16px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--acct);border:0;border-radius:99px;padding:13px 22px;font:inherit;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.28)}
#sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);z-index:5}
#sheet[hidden]{display:none}
.bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.bar button{font:inherit;border:0;background:none;color:var(--mute);padding:6px}
.bar .save{background:var(--acc);color:var(--acct);border-radius:99px;padding:8px 20px;font-weight:700}
form,.f{padding:8px 16px 80px}
label,.lb{display:block;margin:14px 0 4px;font-size:14px;color:var(--mute)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:84px}
.pv{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:6px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.sr span{flex:1}.sr b{font-weight:400;color:var(--mute);font-size:12px}
.st button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-left:4px}
.st button.on{background:var(--acc);border-color:var(--acc);color:var(--acct)}
.del{margin-top:28px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--acc);background:none;color:var(--acc);font:inherit}
.hint{margin:4px 2px 0;font-size:12.5px;line-height:1.45;color:var(--mute)}
#guide{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);z-index:9}
#guide[hidden]{display:none}
.gd{padding:24px 20px 40px;max-width:560px;margin:0 auto}
.gd h2{margin:0 0 6px;color:var(--moss);font-size:24px}
.gd p.hint{font-size:14px;margin:12px 2px}
.gs{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.gs .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--acct);display:grid;place-items:center;font-weight:700}
#msg{padding:10px 16px;color:var(--acc);font-size:14px}
@media (min-width:700px){#list{grid-template-columns:repeat(4,1fr)}}
</style></head>

<script>

const TIP={work:'每次做完作品，當天就記下照片和心得，越快越不會忘。',idea:'看到喜歡的比賽作品就存起來。一定要記來源，並寫一句「我學到什麼」。',concept:'還沒有花材也可以先寫想法。先寫一句創作主軸，其他慢慢補。',practice:'不要整件複製，只挑一個局部做法來練習，並記下卡在哪裡。',matrix:'沒想法時按「重抽一組」，看看隨機組合，有感覺的就存起來。',flower:'去花市前先看當月的花材。「還沒用過」可以找出還沒練習的花材。'};
const HINT={work:{photo:'拍整件作品的正面，光線要亮、背景乾淨，之後才看得清楚。',name:'取一個好認的名字，例如「春日手綁花束」。',concept:'如果這件作品用了構思庫裡的主題，在這裡選。',date:'預設是今天，需要時可以改。',kind:'對應比賽的題型，選最接近的一個。',order:'只有「神秘箱」才要填，選第幾次。',mins:'題目規定的時間，可以對照比賽時程表。',used:'你實際做了幾分鐘，和規定時間比一比。',cond:'這次的花材是怎麼來的？大會指定、自己選，或神秘箱。',form:'作品最後怎麼呈現？放容器、手拿、掛牆、放桌面，或做成環形。',flowers:'用「、」分開，例如「尤加利、玫瑰」。花材庫會自動算用過幾次。',desc:'寫這件作品想表達什麼、怎麼做。',theory:'寫你用了什麼架構或構圖，例如平行式、放射式。',sketch:'做之前的手繪草圖，拍起來放在這裡。',proc:'記時間怎麼分配、哪裡卡住，下次才會進步。',rate:'對照評分表自己打分，1 最弱、5 最好。誠實打分最有用。',why:'用一句話說明為什麼這樣評。',next:'下次只要改一件事，寫在這裡。'},idea:{photo:'存比賽作品的照片，只供自己學習用。',name:'作品名稱；沒有的話，寫選手名加年份。',event:'例如 World Cup、Eurofleurs、技能競賽。',year:'比賽那一年。',player:'方便追蹤同一位選手的風格變化。',nation:'選手代表的國家或地區。',award:'例如「金獎」，或「這張的結構很特別」。',kind:'對應你比賽的題型，選最接近的一個。',cat2:'國際賽的作品類別，不確定就選「其他」。',tech2:'這張作品用了什麼做法？可以多選。',theme:'這張想表現什麼概念？可以多選。',pal:'它的配色方式是哪一種？',vibe:'整體給人什麼感覺？可以多選。',tags:'用來描述畫面的詞，可以多選。',flowers:'看得出來的花材。',tech:'補充做法的細節。',facet:'這張作品對你的哪個評分項目最有幫助？',learn:'最重要：用一句話寫你從這張學到什麼。',study:'想拿來練習做法時選，之後可以篩選出來。',detail:'放大圖片看接點、固定處，把看到的寫下來。',scale:'想一想：能不能縮小成一個簡單的作品？',src:'一定要填，之後才找得到出處。'},concept:{photo:'可以放藝術品照片，或看到的景色。',name:'給這個想法取個名字。',spirit:'最重要：一句話寫這件作品想傳達什麼。',src:'這個想法是從哪裡來的？',ref:'寫作品名稱、作者或地點，之後才找得到。',eco:'觀察植物怎麼長、怎麼彎、怎麼枯，把看到的寫下來。',scene:'想像一個畫面：什麼時間、什麼氣氛、什麼感覺？',theme:'還沒決定可以先空著，之後再補。',pal:'還沒決定可以先空著。',vibe:'還沒決定可以先空著。',tech2:'想到可能用的做法就選，沒有就空著。',fit:'這個想法適合哪幾種題型？',sketch:'手繪草圖，畫不好也沒關係。',status:'先選「剛有想法」，之後再依進度改。',rev:'每次修改寫一行：日期＋改了什麼、為什麼。想保留原版就按右上角「另存新版」。'},practice:{photo:'拍你練習做出來的成果。',name:'寫清楚練習哪一個局部。',date:'預設是今天。',from:'選你是看哪一張靈感來練習的。',tech2:'這次練的是哪種做法。',mins:'這次練了幾分鐘。',how:'寫你怎麼固定、怎麼接，下次可以照著做。',hard:'哪裡卡住？怎麼修好的？',lvl:'老實選，系統會幫你找出還要再練的。',next:'下次想改進的一件事。'},flower:{photo:'拍花材的照片，之後才認得出來。',name:'花材的名字。',cat:'這個花材在作品裡主要的角色。',tone:'大致的顏色方向。',color:'寫細節，例如「灰綠」。',vibe:'這個花材適合哪種氛圍。',fit:'適合哪幾種比賽題型。',months:'哪幾個月比較容易買到。沒把握就先空著，問過花市再填。',use:'寫特性和用法。確認過後，把【待確認】刪掉。',care:'怎麼處理，花材才不容易凋謝。',price:'去花市時順手記下。'}};

work:{t:'作品',title:'name',f:[['photo','photo','成品照'],['name','text','作品名稱'],['concept','refc','主題／構思（從構思庫選）'],['date','date','日期'],['kind','sel','題型',TYPES],['order','sel','神秘箱次序（只有神秘箱要填）',['一','二','三']],['mins','sel','規定時間（分鐘）',[60,90,120,180]],['used','num','實際用時（分鐘）'],['cond','sel','材料條件',['大會指定','自選','神秘箱']],['form','sel','作品形式',['容器','手持（花束）','壁面','桌面','環形']],['flowers','text','使用花材（用頓號分隔）'],['desc','area','創作說明'],['theory','area','創作理論（架構）'],['sketch','photo','手繪稿'],['proc','area','過程紀錄（時間分配、卡關處）'],['rate','stars','依評分標準自評（1～5）'],['why','text','自評原因（一句話）'],['next','text','下次改進']]},

 tx(s,m,f){return new Promise((ok,no)=>{const t=this.db.transaction(s,m);const q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})},
 all(s){return this.tx(s,'readonly',o=>o.getAll())},
 put(s,v){return this.tx(s,'readwrite',o=>o.put(v))},
 del(s,k){return this.tx(s,'readwrite',o=>o.delete(k))}};
